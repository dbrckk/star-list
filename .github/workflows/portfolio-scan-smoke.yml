                                          version=kwargs.get("version", 2))
              return {
                  "project": {
                      "id": identity, "project_id": identity,
                      "repository": target, "final_goal": "Tracking: " + marker,
                      "token_budget": scanner.INTEGRATION_TOKEN_BUDGET,
