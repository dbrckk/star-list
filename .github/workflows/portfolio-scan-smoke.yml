              source = next(item for item in catalog_entries
                            if item["repo"].lower() == slug.lower())
              agent_profile = {
                  "domains": ["ai_agents"],
                  "language": language,
                  "terms": scanner.tokens(terms),
                  "dependencies": "",
                  "overview": "",
