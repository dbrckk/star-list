              {"final_goal": integration_marker("dbrckk/Jumpy", {"repository": "c/d"}),
               "created_at": "2026-10-16T23:20:00-02:00"},
              {"final_goal": "unrelated", "created_at": "2026-10-16T15:00:00Z"},
