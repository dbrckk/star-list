name: Build Freebuff Mobile Android APK
concurrency:
  group: freebuff-mobile-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [freebuff-android]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/freebuff-mobile-apk.yml'
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/freebuff-mobile-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and installer syntax checks
        run: |
          node --check mobile-app/server.js
          node --check mobile-app/www/app.js
          bash -n mobile-app/install-termux.sh
      - run: node --test mobile-app/tests/server.test.js
  apk:
    needs: node-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify installed Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || command -v sdkmanager
          echo "Using Android SDK: $ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        run: gradle -p mobile-app/android --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: freebuff-mobile-debug-apk
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
