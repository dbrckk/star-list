name: Apply reviewed GitHub stars batch 5

on:
  push:
    branches:
      - feat/github-stars-batch-5-20261009
    paths:
      - .github/workflows/apply-reviewed-stars-batch-5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed import with catalog validation
        run: |
          python scripts/star_import_pipeline.py \
            imports/github-stars-2026-10-09-batch-5.json \
            --metadata reports/star-import-2026-10-09-batch-5-reviewed.json \
            --write > /tmp/star-batch-5-result.json
          python scripts/validate_catalog.py
          python scripts/validate_json_contract.py catalog.schema.json catalog.json
      - name: Commit validated catalog to import branch
        run: |
          if git diff --quiet -- catalog.json; then
            echo "Catalog already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Catalog 71 reviewed GitHub stars from batch 5"
          git push origin HEAD:feat/github-stars-batch-5-20261009
