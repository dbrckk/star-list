name: Validate catalog

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Test recommendation engine
        run: python scripts/test_recommend.py
