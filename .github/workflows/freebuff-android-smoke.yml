name: Freebuff Android checks
on:
  push:
    branches: [freebuff-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell and simulated Termux tests
        run: bash .devcontainer/tests/test-shell.sh
  official-cli-install:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official Freebuff CLI and execute version check
        run: bash .devcontainer/setup.sh
      - name: Menu smoke check
        run: printf '0\n' | "$HOME/.local/bin/freebuff-mobile" >/dev/null
